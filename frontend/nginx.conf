server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Remove trailing slash redirect (except root)
    rewrite ^/(.+)/$ /$1 permanent;

    # HTML must be revalidated after every deployment so clients do not keep
    # an old route document that points at a previous application shell.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    location /api/ {
        proxy_pass http://oms-backend:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /uploads/ {
        proxy_pass http://oms-backend:3001/uploads/;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
